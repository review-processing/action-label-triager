# Adds 1 domain/* and 0 to 2 area/* labels to an issue, picked by a local decision model (d3, Ollama, CPU).
# Nothing but the labels of the repository can come out of the model: it answers choice questions.
#
# Caller (see examples/label-triage.yaml):
#   jobs:
#     triage:
#       runs-on: ubuntu-26.04-arm
#       permissions: { contents: read, issues: write }
#       steps:
#         - uses: review-processing/action-label-triager@<sha>
#           with: { issue: "${{ github.event.issue.number }}", dry-run: 'false' }

name: label triager
description: Pick the domain/* and area/* labels of an issue with a local d3 decision model, and add them.

inputs:
  issue:
    description: Issue number
    required: true
  repo:
    description: Repository of the issue
    default: ${{ github.repository }}
  labels-repo:
    description: Repository whose labels (with their descriptions) and past issues are used; missing labels are created in `repo`
    default: ''
  dry-run:
    description: Only report the labels in the run summary, add nothing
    default: 'false'
  force:
    description: Triage even if the issue already has a domain/* label
    default: 'false'
  model:
    description: Ollama decision model
    default: d3:2b
  token:
    description: Token that reads the repository issues and labels (and adds labels unless dry-run)
    default: ${{ github.token }}

outputs:
  labels:
    description: JSON array of the labels picked (empty when skipped)
    value: ${{ steps.decide.outputs.labels }}

runs:
  using: composite
  steps:
    # Every input goes through env, never into a script.
    - name: check inputs
      shell: bash
      env:
        ISSUE: ${{ inputs.issue }}
        REPO: ${{ inputs.repo }}
        LABELS_REPO: ${{ inputs.labels-repo }}
        MODEL: ${{ inputs.model }}
        DRY_RUN: ${{ inputs.dry-run }}
        FORCE: ${{ inputs.force }}
      run: |
        [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::issue must be a number"; exit 1; }
        [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::bad repo"; exit 1; }
        [[ -z "$LABELS_REPO" || "$LABELS_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::bad labels-repo"; exit 1; }
        echo "LABEL_TRIAGER_LABELS_REPO=${LABELS_REPO:-$REPO}" >> "$GITHUB_ENV"
        [[ "$MODEL" =~ ^[A-Za-z0-9._/-]+(:[A-Za-z0-9._-]+)?$ ]] || { echo "::error::bad model"; exit 1; }
        [[ "$DRY_RUN" =~ ^(true|false)$ && "$FORCE" =~ ^(true|false)$ ]] || { echo "::error::dry-run and force are true or false"; exit 1; }
        mkdir -p "$RUNNER_TEMP/label-triager" "$RUNNER_TEMP/label-triager-tools"
        echo "LABEL_TRIAGER_OUT=$RUNNER_TEMP/label-triager" >> "$GITHUB_ENV"
        echo "LABEL_TRIAGER_TOOLS=$RUNNER_TEMP/label-triager-tools" >> "$GITHUB_ENV"

    # Before the model is set up: an issue that is already triaged costs a few seconds.
    - name: already triaged?
      id: gate
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE: ${{ inputs.issue }}
        REPO: ${{ inputs.repo }}
        FORCE: ${{ inputs.force }}
      run: |
        domains=$(gh issue view "$ISSUE" -R "$REPO" --json labels --jq '[.labels[].name | select(startswith("domain/"))] | join(", ")')
        if [ -n "$domains" ] && [ "$FORCE" != true ]; then
          echo "::notice::issue $ISSUE already has $domains: nothing to do (force: true to triage it anyway)"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: install node
      if: steps.gate.outputs.skip != 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24 # runs triage.ts as it is: Node strips the types

    # Downloaded at each run, no Actions cache: restoring ~4 GB from the cache was slower than downloading them.
    # d3 needs Ollama 0.40.9 or later.
    - name: install ollama and pull the model
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      env:
        MODEL: ${{ inputs.model }}
      run: |
        version=v0.40.16
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-ARM64) asset=ollama-linux-arm64.tar.zst sha256=e45b8e6dcb86cb9f3057396351655079c9a4879b4ced2678c9350d375dcbc224 ;;
          Linux-X64)   asset=ollama-linux-amd64.tar.zst sha256=87bfafb2acbc89b2e6a1be0a9043de6aa75fb450696f86bc426e65fc448f788d ;;
          *) echo "::error::runs on Linux runners only (ubuntu-26.04-arm is the one measured)"; exit 1 ;;
        esac
        cd "$LABEL_TRIAGER_TOOLS"
        curl -fsSL --retry 3 -o "$asset" "https://github.com/ollama/ollama/releases/download/$version/$asset"
        echo "$sha256  $asset" | sha256sum -c -
        mkdir -p ollama && tar --zstd -xf "$asset" -C ollama && rm "$asset"
        ollama=$(find ollama -type f -name ollama | head -1)
        [ -n "$ollama" ] || { echo "::error::ollama binary not found"; exit 1; }
        chmod +x "$ollama"
        export OLLAMA_MODELS="$LABEL_TRIAGER_TOOLS/models"
        nohup "$ollama" serve > "$LABEL_TRIAGER_OUT/ollama.log" 2>&1 &
        for _ in $(seq 60); do curl -sf http://127.0.0.1:11434/api/version > /dev/null && break; sleep 1; done
        "$ollama" pull "$MODEL" > "$LABEL_TRIAGER_OUT/ollama-pull.log" 2>&1 || { tail -n 20 "$LABEL_TRIAGER_OUT/ollama-pull.log"; exit 1; }
        echo "ready in ${SECONDS}s"

    # Read only: the issue, the labels and the last 150 issues (examples) of labels-repo, the folder -> domain map.
    - name: fetch
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}/label-triager
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE: ${{ inputs.issue }}
        REPO: ${{ inputs.repo }}
      run: |
        fields=number,title,body,labels,createdAt
        gh issue view "$ISSUE" -R "$REPO" --json "$fields" > issue.json
        gh label list -R "$LABEL_TRIAGER_LABELS_REPO" --limit 500 --json name,description,color > labels.json
        # examples: ~100 triaged issues; 50 or 100 score as well as 320 in the eval, none loses a third of the areas
        gh issue list -R "$LABEL_TRIAGER_LABELS_REPO" --state all --limit 150 --json "$fields" > issues.json
        gh api repos/issue-management/pdmn-dsktp-app/contents/folder-domains.json --jq .content | base64 -d > folder-domains.json

    - name: decide
      id: decide
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}/label-triager
      env:
        REPO: ${{ inputs.repo }}
        MODEL: ${{ inputs.model }}
      run: |
        same=$([ "$REPO" = "$LABEL_TRIAGER_LABELS_REPO" ] && echo true || echo false)
        node "$GITHUB_ACTION_PATH/triage.ts" --issue issue.json --labels labels.json --issues issues.json --folders folder-domains.json \
          --repo "$LABEL_TRIAGER_LABELS_REPO" --same-repo "$same" --model "$MODEL" > result.json
        echo "labels=$(jq -c .labels result.json)" >> "$GITHUB_OUTPUT"

    # Shown as text: no issue text in the summary, only the title in a code span.
    - name: summary
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}/label-triager
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        MODEL: ${{ inputs.model }}
      run: |
        jq -r --arg dry "$DRY_RUN" --arg model "$MODEL" --arg repo "$LABEL_TRIAGER_LABELS_REPO" --slurpfile issue issue.json '
          def code: "`" + (tostring | gsub("`"; "'"'"'")) + "`";
          ($issue[0]) as $i
          | "### Labels for issue \($i.number) " + ($i.title | code),
            "",
            (if $dry == "true" then "Dry run: nothing added." else "Added." end) + " Model \($model), \(.seconds * 10 | round / 10) s.",
            "",
            "| label | probability |", "|---|---|",
            (.scores | to_entries[] | "| \(.key | code) | \(if .value == null then "fallback" else "\(.value * 100 | round)%" end) |"),
            "",
            "Already on the issue: " + ([$i.labels[].name | code] | join(", ") | if . == "" then "none" else . end),
            "",
            "<details><summary>Candidates: what the model scored (confidence: domain \(.explain.confidence.domain * 100 | round)%, area \(.explain.confidence.area * 100 | round)%)</summary>",
            "",
            "| domain | % | area | % |", "|---|---|---|---|",
            ((.probabilities.domain | to_entries[:8]) as $d | (.probabilities.area | to_entries[:8]) as $a | .labels as $picked
              | range(0; 8) as $n
              | def cell($e): if $e == null then "| |" else ($e.key | code | if ($picked | index($e.key)) then "**" + . + "**" else . end) + " | \($e.value * 100 | round)%" end;
              "| " + cell($d[$n]) + " | " + cell($a[$n]) + " |"),
            "",
            (.explain.areas[:5][] | "- area \(.label | code) \(.p * 100 | round)%: \(.why)"),
            (if (.explain.held | length) > 0 then "- not offered (the issue does not name that extension): " + ([.explain.held[] | code] | join(", ")) else empty end),
            (if (.explain.paths | length) > 0 then "- paths named in the issue: " + ([.explain.paths[] | (.path | code) + " → " + .domain] | join(", ")) else empty end),
            "",
            "</details>",
            "",
            "<details><summary>Examples: the \(.explain.similar | length) most similar past issues given to the model</summary>",
            "",
            "| similarity | issue | labels |", "|---|---|---|",
            (.explain.similar[] | "| \(.score * 100 | round)% | [\(.number) \(.title | gsub("[\\[\\]|`<>]"; ""))](https://github.com/\($repo)/issues/\(.number)) | \([.labels[] | code] | join(", ")) |"),
            "",
            "</details>"
        ' result.json >> "$GITHUB_STEP_SUMMARY"

    - name: add the labels
      if: steps.gate.outputs.skip != 'true' && inputs.dry-run != 'true'
      shell: bash
      working-directory: ${{ runner.temp }}/label-triager
      env:
        GH_TOKEN: ${{ inputs.token }}
        ISSUE: ${{ inputs.issue }}
        REPO: ${{ inputs.repo }}
      run: |
        # labels of labels-repo missing here are created with its color and description; an existing label is never changed
        if [ "$REPO" != "$LABEL_TRIAGER_LABELS_REPO" ]; then
          existing=$(gh label list -R "$REPO" --limit 500 --json name --jq '.[].name')
          while IFS=$'\t' read -r name color description; do
            grep -qxF -- "$name" <<< "$existing" || gh label create "$name" -R "$REPO" --color "$color" --description "$description"
          done < <(jq -r --slurpfile all labels.json '.labels[] as $l | $all[0][] | select(.name == $l) | [.name, .color, .description] | @tsv' result.json)
        fi
        # only adds, never removes
        args=()
        while IFS= read -r label; do args+=(--add-label "$label"); done < <(jq -r '.labels[]' result.json)
        [ "${#args[@]}" -eq 0 ] || gh issue edit "$ISSUE" -R "$REPO" "${args[@]}"

    - name: upload
      if: always() && steps.gate.outputs.skip != 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: label-triager
        path: ${{ runner.temp }}/label-triager
        retention-days: 7

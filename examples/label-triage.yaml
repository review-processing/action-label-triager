# Copy to .github/workflows/label-triage.yaml of the repository to triage (podman-desktop/podman-desktop)
# and replace <sha> with a commit of review-processing/action-label-triager.
# Repository variable LABEL_TRIAGE_DRY_RUN=true: new issues are only reported in the run summary (shadow mode).

name: label-triage

on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      dry-run:
        description: Only report the labels, add nothing
        type: boolean
        default: true

permissions: {}

jobs:
  triage:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    concurrency: label-triage-${{ github.event.issue.number || inputs.issue }}
    steps:
      - uses: review-processing/action-label-triager@<sha>
        with:
          issue: ${{ github.event.issue.number || inputs.issue }}
          # dispatch: its checkbox; issue events: the repository variable (default: add the labels)
          dry-run: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.dry-run) || vars.LABEL_TRIAGE_DRY_RUN || 'false' }}

# Tests and lints on every pull request; nothing is triaged here.

name: pr-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun run test
      # the action runs triage.ts with node, not bun
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node triage.ts --help
      - name: actionlint
        run: |
          asset=actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSL --retry 3 -o "$asset" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$asset"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $asset" | sha256sum -c -
          tar -xzf "$asset" actionlint
          ./actionlint .github/workflows/*.yaml examples/*.yaml

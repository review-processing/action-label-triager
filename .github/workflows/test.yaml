# Runs the action from this repository on an issue of another repository, in dry run: reads only.
# Measures the time on the runner and fills the cache of Ollama and the model.

name: test

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
        type: string
      repo:
        description: Repository of the issue
        type: string
        default: podman-desktop/podman-desktop
      model:
        description: Ollama decision model
        type: string
        default: d3:2b

permissions: {}

jobs:
  triage:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          issue: ${{ inputs.issue }}
          repo: ${{ inputs.repo }}
          model: ${{ inputs.model }}
          dry-run: 'true'
          force: 'true'
